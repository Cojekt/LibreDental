name: Code Review & Build (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-checks:
    name: Go Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env
        with:
          setup-node: "false"
          cache-node: "false"

      - name: Check Go Code Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted cleanly with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet (Entire Repository)
        run: go vet ./...

      - name: Go Unit Tests
        run: go test -v ./internal/...

  # Its own job, which build doesn't need, so a Stedi outage can't block merges.
  stedi-live:
    name: Stedi Live API Check (test mode)
    runs-on: ubuntu-latest
    # Secrets aren't passed to fork or Dependabot PRs; everywhere else a missing key is an error.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env
        with:
          setup-node: "false"
          cache-node: "false"

      - name: Stedi Live API Test
        env:
          STEDI_API_KEY: ${{ secrets.STEDI_TEST_API_KEY }}
        run: |
          if [ -z "$STEDI_API_KEY" ]; then
            echo "The STEDI_TEST_API_KEY repository secret is missing or empty."
            exit 1
          fi
          go test -v -count=1 ./internal/services/claims -run TestStediLiveTestMode

  frontend-checks:
    name: Frontend Quality & Type Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env
        with:
          cache-go: "false"

      - name: Generate Wails Bindings
        run: task common:generate:bindings

      - name: Check Frontend Formatting
        working-directory: frontend
        run: npm run format:check

      - name: Svelte & TypeScript Check
        working-directory: frontend
        run: npm run check

      - name: Frontend Interaction Tests
        working-directory: frontend
        run: npm run test

      - name: Build Server Binary for End-to-End Tests
        run: task common:build:server DEV=true EXTRA_TAGS=dev

      - name: Install Playwright Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload End-to-End Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  build:
    name: Build Application & Server
    needs: [go-checks, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env

      - name: Build Server Binary
        run: task common:build:server

      - name: Build Desktop Application
        run: task build
