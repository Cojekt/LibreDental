name: Code Review & Build (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-checks:
    name: Go Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env
        with:
          setup-node: "false"
          cache-node: "false"

      - name: Check Go Code Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted cleanly with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet (Entire Repository)
        run: go vet ./...

      - name: Go Unit Tests
        run: go test -v ./internal/...

  frontend-checks:
    name: Frontend Quality & Type Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env
        with:
          cache-go: "false"

      - name: Generate Wails Bindings
        run: task common:generate:bindings

      - name: Check Frontend Formatting
        working-directory: frontend
        run: npm run format:check

      - name: Svelte & TypeScript Check
        working-directory: frontend
        run: npm run check

  build:
    name: Build Application & Server
    needs: [go-checks, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env

      - name: Build Server Binary
        run: task build:server

      - name: Build Desktop Application
        run: task build
