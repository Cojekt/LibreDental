name: Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: libredental-linux-amd64
            platform: linux
          - os: macos-latest
            artifact_name: libredental-darwin-universal
            platform: darwin
          - os: windows-latest
            artifact_name: libredental-windows-amd64.exe
            platform: windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            build-essential

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI & Task CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2
          go install github.com/go-task/task/v3/cmd/task@v3.41.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Desktop Application
        run: task build

      - name: Prepare Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release_assets
          cp bin/libredental release_assets/${{ matrix.artifact_name }}

      - name: Prepare Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release_assets
          cp bin/libredental release_assets/${{ matrix.artifact_name }}
          if [ -d "bin/libredental.app" ]; then
            cd bin && zip -r ../release_assets/libredental-darwin-app.zip libredental.app && cd ..
          fi

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          Copy-Item bin/libredental.exe release_assets/${{ matrix.artifact_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-assets-${{ matrix.platform }}
          path: release_assets/*

  generate-demo:
    name: Generate Demo Database
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.41.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate Demo Database
        run: task demo

      - name: Upload Demo Database Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-assets-demo
          path: libredental.db

  release:
    name: Publish GitHub Release
    needs: [build, generate-demo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_download
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release_download
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release_download/*
          generate_release_notes: true
