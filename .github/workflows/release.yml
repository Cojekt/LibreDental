name: Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: libredental-linux-amd64
            platform: linux
          - os: windows-latest
            artifact_name: libredental-windows-amd64.exe
            platform: windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env

      - name: Package Application
        run: task -t .github/Taskfile.yml package

      - name: Prepare Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release_assets
          cp dist/*.deb dist/*.rpm dist/*.AppImage dist/*.pkg.tar.zst release_assets/ 2>/dev/null || true
          cp dist/*-server release_assets/libredental-server-linux-amd64 2>/dev/null || true

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          Copy-Item dist/*-installer.exe release_assets/ -ErrorAction SilentlyContinue
          Copy-Item dist/*-server.exe release_assets/libredental-server-windows-amd64.exe -ErrorAction SilentlyContinue

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-assets-${{ matrix.platform }}
          path: release_assets/*

  generate-demo:
    name: Generate Demo Database
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CI Environment
        uses: ./.github/actions/setup-env
        with:
          setup-node: "false"
          cache-node: "false"

      - name: Generate Demo Database
        run: task -t .github/Taskfile.yml demo

      - name: Upload Demo Database Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-assets-demo
          path: dist/libredental-demo-data.zip

  release:
    name: Publish GitHub Release
    needs: [build, generate-demo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_download
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release_download
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release_download/*
          generate_release_notes: true
