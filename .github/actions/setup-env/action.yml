name: "Setup LibreDental CI Environment"
description: "Installs system dependencies (Linux/Windows), Go, Node.js, Wails CLI, Task CLI, and frontend dependencies"

runs:
  using: "composite"
  steps:
    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-4-dev \
          libwebkitgtk-6.0-dev \
          libayatana-appindicator3-dev \
          pkg-config \
          build-essential

    - name: Install System Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        choco install nsis --no-progress -y
        echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.26.5"
        cache: true
        cache-dependency-path: go.sum

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Wails v3 CLI & Task CLI
      shell: bash
      run: |
        go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2
        go install github.com/go-task/task/v3/cmd/task@v3.41.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Install Frontend Dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

