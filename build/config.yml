# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: "3"

# This information is used to generate the build assets.
info:
  companyName: "Cojekt" # The name of the company
  productName: "LibreDental" # The name of the application
  productIdentifier: "com.cojekt.libredental" # The unique product identifier
  description: "LibreDental — Open-Source Dental Practice Management" # The application description
  copyright: "© 2026, Cojekt" # Copyright text
  comments: "https://github.com/LibreDental/libredental" # Comments
  version: "0.1.0" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car exists, defaults to "appicon"

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   bundleID: "com.mycompany.myproduct"
#   displayName: "My Product"
#   version: "0.0.1"
#   company: "My Company"
#   comments: "Some Additional Comments"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: task clean:unused-platforms
      type: blocking
    - cmd: task build DEV=true
      type: blocking
    - cmd: task common:dev:frontend
      type: background
    - cmd: node scripts/wait-for-devserver.mjs
      type: blocking
    - cmd: task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
