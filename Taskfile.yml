version: "3"

vars:
  APP_NAME: "libredental"
  BIN_DIR: "dist"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  GOOS: "{{.GOOS | default OS}}"
  exeExt: '{{if eq OS "windows"}}.exe{{end}}'

tasks:
  desktop:
    desc: Runs the desktop application in development mode
    env:
      FRONTEND_DEVSERVER_URL: "http://127.0.0.1:{{.VITE_PORT}}"
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  server:
    desc: Builds and runs the application in server mode (HTTP server at http://localhost:4242)
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config build/config.yml -dir build
      - '{{if eq OS "windows"}}if exist "build\darwin" rmdir /s /q "build\darwin" & if exist "build\ios" rmdir /s /q "build\ios"{{else}}rm -rf build/darwin build/ios{{end}}'
      - wails3 generate bindings -ts -i
      - cd frontend && {{.PACKAGE_MANAGER}} run build
      - go build -tags server,dev -o {{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}
      - "{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"

  demo:
    desc: "Generates a standalone pre-populated save archive (libredental-demo-data.zip)"
    cmds:
      - '{{if eq OS "windows"}}if not exist "{{.BIN_DIR}}" mkdir "{{.BIN_DIR}}"{{else}}mkdir -p "{{.BIN_DIR}}"{{end}}'
      - go run ./internal/demo/gen.go {{.BIN_DIR}}/libredental-demo-data.zip

  artifact:
    desc: Builds all local artifacts (desktop binary, server binary, and demo data)
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config build/config.yml -dir build
      - '{{if eq OS "windows"}}if exist "build\darwin" rmdir /s /q "build\darwin" & if exist "build\ios" rmdir /s /q "build\ios"{{else}}rm -rf build/darwin build/ios{{end}}'
      - wails3 generate bindings -ts -i
      - cd frontend && {{.PACKAGE_MANAGER}} run build
      - go build -tags dev -o {{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}
      - go build -tags server,dev -o {{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}
      - task: demo

  format:
    desc: Formats Go code with gofmt and frontend code with prettier
    cmds:
      - gofmt -w -s .
      - cd frontend && {{.PACKAGE_MANAGER}} run format

